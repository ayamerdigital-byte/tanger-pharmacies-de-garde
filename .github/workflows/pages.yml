name: Refresh and publish pharmacy roster

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 0,6,12,18 * * *'
      timezone: 'Africa/Casablanca'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEPLOY_TARGET: github-pages
    steps:
      - uses: actions/checkout@v7
      - name: Fetch latest Facebook roster
        run: npm run sync:pages
      - name: Build and upload Astro site
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
